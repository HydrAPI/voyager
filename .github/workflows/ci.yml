# Checks every push to master and every pull request: the build, the tests,
# clippy, the translations and their {placeholders}, that Arkha still
# builds with its oldest supported Rust (Debian 13's), and that it builds
# and installs as a Fedora and an Arch Linux package (as the release
# workflow makes them).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build, tests, clippy, translations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK 3 and gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev gettext
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Translations
        run: |
          for po in po/*.po; do
            msgfmt --check --statistics -o /dev/null "$po"
          done
      - name: Placeholders
        run: python3 tools/check-placeholders.py

  oldest-rust:
    name: Build with Debian 13's Rust (1.85)
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - name: Install Rust, GTK 3 and gettext
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates cargo rustc libgtk-3-dev gettext pkg-config build-essential
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --locked

  fedora:
    name: Fedora package
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install the build dependencies
        run: dnf install -y git cargo rust gcc gtk3-devel gettext rpm-build
      - uses: actions/checkout@v7
      - name: Build the package
        run: sh packaging/rpm/build.sh
      - name: Its files
        run: rpm -qlp target/rpm/*.rpm
      # Its dependencies resolve, from Fedora's own repositories.
      - name: Install it
        run: dnf install -y target/rpm/*.rpm

  arch:
    name: Arch Linux package
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git cargo gettext gtk3 gvfs hicolor-icon-theme
      # The whole history: the package's version counts the commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # makepkg won't run as root.
      - name: Build the package
        run: |
          useradd -m builder
          chown -R builder: .
          su builder -c 'cd packaging/arch && makepkg --noconfirm'
      - name: Its files
        run: pacman -Qlp packaging/arch/*.pkg.tar.zst
      - name: Install it
        run: pacman -U --noconfirm packaging/arch/*.pkg.tar.zst
