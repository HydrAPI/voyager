# Checks every push to master and every pull request: the build, the tests,
# clippy, the translations and their {placeholders}, and a package for
# every distribution Arkha supports, built and installed in a container of
# that distribution as the release workflow makes it: Debian 13 (with its
# Rust 1.85, the oldest Arkha supports), Ubuntu 26.04 (also the Debian
# package, which the release offers for it), Fedora and Arch Linux, and the
# prebuilt program for the others.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build, tests, clippy, translations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK 3 and gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev gettext
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Translations
        run: |
          for po in po/*.po; do
            msgfmt --check --statistics -o /dev/null "$po"
          done
      - name: Placeholders
        run: python3 tools/check-placeholders.py

  debian:
    name: Debian package (Rust 1.85)
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - name: Install the build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cargo rustc libgtk-3-dev gettext pkg-config build-essential dpkg-dev
      - uses: actions/checkout@v7
      # Debian's own Rust: 1.85, the oldest Arkha supports.
      - name: Build the package
        run: sh packaging/deb/build.sh
      - name: Its files
        run: dpkg-deb -c target/deb/*.deb
      # Its dependencies resolve, from Debian's own repositories.
      - name: Install it
        run: apt-get install -y ./target/deb/*.deb
      # For the Ubuntu job: the release's .deb is this one.
      - uses: actions/upload-artifact@v7
        with:
          name: deb-debian
          path: target/deb/*.deb
          if-no-files-found: error

  ubuntu:
    name: Ubuntu package
    needs: debian
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: Install the build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cargo rustc libgtk-3-dev gettext pkg-config build-essential dpkg-dev
      - uses: actions/checkout@v7
      - name: Build the package
        run: sh packaging/deb/build.sh
      - name: Install it
        run: apt-get install -y ./target/deb/*.deb
      # The release offers the package built on Debian for Ubuntu too.
      - uses: actions/download-artifact@v8
        with:
          name: deb-debian
          path: debian-deb
      - name: Install the Debian package instead
        run: |
          apt-get remove -y arkha
          apt-get install -y ./debian-deb/*.deb

  prebuilt:
    name: Prebuilt program (other distributions)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK 3 and gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev gettext
      - uses: dtolnay/rust-toolchain@stable
      - name: Build it
        run: sh packaging/tarball/build.sh
      - name: Its files
        run: tar -tzvf target/tarball/*.tar.gz

  fedora:
    name: Fedora package
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install the build dependencies
        run: dnf install -y git cargo rust gcc gtk3-devel gettext rpm-build
      - uses: actions/checkout@v7
      - name: Build the package
        run: sh packaging/rpm/build.sh
      - name: Its files
        run: rpm -qlp target/rpm/*.rpm
      # Its dependencies resolve, from Fedora's own repositories.
      - name: Install it
        run: dnf install -y target/rpm/*.rpm

  arch:
    name: Arch Linux package
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install the build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git cargo gettext gtk3 gvfs hicolor-icon-theme
      # The whole history: the package's version counts the commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # makepkg won't run as root.
      - name: Build the package
        run: |
          useradd -m builder
          chown -R builder: .
          su builder -c 'cd packaging/arch && makepkg --noconfirm'
      - name: Its files
        run: pacman -Qlp packaging/arch/*.pkg.tar.zst
      - name: Install it
        run: pacman -U --noconfirm packaging/arch/*.pkg.tar.zst
