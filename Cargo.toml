[package]
name = "arkha"
version = "0.1.0"
edition = "2021"
# Debian 13's; checked by clippy (incompatible_msrv).
rust-version = "1.85"

[dependencies]
async-channel = "2"
gdk = "0.18"
gdk-pixbuf = "0.18"
gio = "0.18"
glib = { version = "0.18", features = ["v2_66"] }
gtk = "0.18"
blake2 = "0.10"
crc32fast = "1"
libc = "0.2"
pango = { version = "0.18", features = ["v1_44"] }
regex = "1"

[profile.release]
lto = "thin"
strip = true
