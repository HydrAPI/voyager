[package]
name = "voyager"
version = "1.1.4"
edition = "2021"
# Debian 13's; checked by clippy (incompatible_msrv).
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "A fast graphical file manager"
authors = ["HydrAPI <245955427+HydrAPI@users.noreply.github.com>", "dekart811 <mail@dekart811.net>"]
repository = "https://github.com/HydrAPI/voyager"
readme = "README.md"
# An application, not a library for crates.io.
publish = false

[dependencies]
async-channel = "2"
gdk = "0.18"
gdk-pixbuf = "0.18"
gio = "0.18"
glib = { version = "0.18", features = ["v2_66"] }
gtk = "0.18"
blake2 = "0.10"
crc32fast = "1"
libc = "0.2"
pango = { version = "0.18", features = ["v1_44"] }
regex = "1"

[profile.release]
lto = "thin"
strip = true
